[project]
name = "tmf-backend"
version = "0.0.0"
description = "Test & Measurement Framework — Python platform (core + modules)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiomqtt>=2.0",        # async MQTT client, MQTT5 (response-topic + correlation-id)
    "aiosqlite>=0.20",     # per-station embedded DB
    "jsonschema>=4.21",    # JSON Schema validation (PRINCIPLES §4)
    "argon2-cffi>=23.1",   # password hashing for the Auth module (CORE §6.4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",         # FastAPI test client
    "ruff>=0.4",
    "pyinstaller>=6.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
