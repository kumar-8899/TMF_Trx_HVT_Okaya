[project]
name = "tmf-backend"
version = "1.27.3"
description = "Test & Measurement Framework — Python platform (core + modules)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiomqtt>=2.0",        # async MQTT client, MQTT5 (response-topic + correlation-id)
    "aiosqlite>=0.20",     # per-station embedded DB
    "jsonschema>=4.21",    # JSON Schema validation (PRINCIPLES §4)
    "argon2-cffi>=23.1",   # password hashing for the Auth module (CORE §6.4)
    "SQLAlchemy>=2.0",     # relational report store (MySQL / SQL Server), Report module
    "pypdf>=4.0",          # pure-Python PDF text extraction (portal library search)
]

[project.optional-dependencies]
# Report DB drivers — installed per deployment for the client's chosen server.
# SQL Server also needs the OS "ODBC Driver 18 for SQL Server".
report-db = [
    "PyMySQL>=1.1",        # MySQL  (mysql+pymysql)
    "pyodbc>=5.0",         # SQL Server (mssql+pyodbc)
]
# Frozen release build (SECURE_DISTRIBUTION.md §5, ADR 0003): python build_release.py
release = [
    "pyinstaller>=6.6",    # freezes both run.exe and run_station.exe (onefile) — no compile
                            # step, no IP protection
    "pywebview>=5.0",       # bundled into the frozen run_station.exe (build_run_station_exe)
]
# Native desktop window for the one-click launcher (station.py). WebView2 on Win11.
desktop = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",         # FastAPI test client
    "ruff>=0.4",
    "cryptography>=42",    # test_release_signer verifies Ed25519 signatures
    "openpyxl>=3.1",       # System Blueprint authoring tool (tools/blueprint) — read/write .xlsx
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "modules", "debug_server", "instrumentlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
