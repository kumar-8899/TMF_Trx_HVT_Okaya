# Per-station local broker (LABVIEW_BRIDGE.md §2).
# Binds loopback only — same trust boundary as the OS; no client auth needed,
# the browser never connects to the broker.

listener 1883 127.0.0.1
allow_anonymous true

persistence false
log_dest stdout
log_type warning

# --- Multi-station uplink (LABVIEW_BRIDGE.md §10) — OFF for singleton ---
# Bridge only low-rate topics to the central broker. NEVER bridge stream/#.
#
# connection st1-to-central
# address    central.broker.example:8883
# bridge_cafile /etc/tmf/ca.crt
# remote_username st1
# topic tmf/st1/event/#  out 1
# topic tmf/st1/status   out 1
# topic tmf/st1/value/#  out 1
# # tmf/st1/stream/# intentionally NOT bridged
