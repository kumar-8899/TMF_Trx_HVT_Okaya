# Release CI — push a tag vX.Y.Z → test → obfuscated (Nuitka) build → zip + hash →
# sign a Keystation .ksupdate → publish a GitHub Release with all three assets.
# The station's "Check for updates" pulls the .ksupdate from the Release.
# SECURE_DISTRIBUTION.md §5-7.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   KS_INTERMEDIATE_SEED   hex Ed25519 seed of the signing intermediate
#   KS_INTERMEDIATE_CERT   the root-signed intermediate cert (JSON, one line)
# The root private key is never here (minted at the offline root ceremony).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Frontend tests + build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Nuitka release build
        working-directory: backend
        run: |
          pip install -e ".[release]"
          python build_release.py --jobs 4

      - name: Package + hash artifact
        shell: python
        run: |
          import hashlib, json, shutil, os
          tag = os.environ["GITHUB_REF_NAME"]
          zip_base = f"super_test_app-{tag}"
          shutil.make_archive(zip_base, "zip", "release-build")
          zip_path = zip_base + ".zip"
          h = hashlib.sha256(open(zip_path, "rb").read()).hexdigest()
          rel = json.load(open("release-build/RELEASE.json"))
          rel["full_artifact_hash"] = h
          rel["artifact"] = zip_path
          json.dump(rel, open("release-build/RELEASE.json", "w"), indent=2)
          print(f"artifact {zip_path} sha256={h}")

      - name: Sign .ksupdate
        env:
          KS_INTERMEDIATE_SEED: ${{ secrets.KS_INTERMEDIATE_SEED }}
          KS_INTERMEDIATE_CERT: ${{ secrets.KS_INTERMEDIATE_CERT }}
          KS_CHANNEL: stable
        run: |
          pip install cryptography
          python tools/ks_release_signer/sign_update.py release-build/RELEASE.json super_test_app-${{ github.ref_name }}.ksupdate

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} `
            "super_test_app-${{ github.ref_name }}.zip" `
            "super_test_app-${{ github.ref_name }}.ksupdate" `
            "release-build/RELEASE.json" `
            --title "Super Test App ${{ github.ref_name }}" `
            --generate-notes
