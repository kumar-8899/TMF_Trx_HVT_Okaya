# Release CI — on a release/* branch or a vX.Y.Z tag: full tests, then the
# Nuitka-compiled (obfuscated) framework artifact + SHA-256 manifest.
# The artifact is what gets signed + registered as a Keystation FRAMEWORK release
# (issuer-side; the private signing key lives in the issuer/HSM, never here).
# SECURE_DISTRIBUTION.md §5, §7.
name: release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Frontend tests + build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Nuitka release build
        working-directory: backend
        run: |
          pip install nuitka
          python build_release.py --jobs 4
        # keystation_core.dll is not in this repo; CI output ships without it and
        # the issuer attaches the signed core DLL at registration time.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: super_test_app-framework-${{ github.ref_name }}
          path: release-build/
          retention-days: 30

      # Next (issuer-side, manual for now): register the artifact as a Keystation
      # framework release - signed manifest + build_timestamp + SBOM (chat #4 model).
