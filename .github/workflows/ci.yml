# Dev CI — every push/PR: tests only (no Nuitka, no Keystation DLL needed;
# the licensing adapter tests run against a fake SDK). SECURE_DISTRIBUTION.md §7.
name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**", "release/**"]

jobs:
  backend:
    runs-on: windows-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install controller (needed by the Developer Hub facts drift gate)
        run: pip install -e ../controller
      - name: Test
        run: python -m pytest -q
      - name: Developer Hub facts are current
        # Also asserted inside pytest (tests/test_devguide_facts.py); repeated here so a stale
        # docs/generated/ fails with the one-line fix in the log instead of a test traceback.
        run: python ../tools/gen_devguide.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build
