name: Python CI

on:
  push:
    paths-ignore:
      - "labview/**"
  pull_request:
    paths-ignore:
      - "labview/**"

jobs:
  # ---- Python platform: lint + tests (incl. broker round-trip) + sidecar ----
  python:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Mosquitto (round-trip tests spin a broker)
        shell: pwsh
        run: choco install mosquitto --no-progress -y
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build PyInstaller sidecar
        run: pyinstaller tmf-sidecar.spec
      - name: Smoke-test frozen sidecar (modules + argon2 load)
        shell: pwsh
        run: |
          $p = Start-Process "dist/tmf-sidecar.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          try {
            $m = Invoke-RestMethod "http://127.0.0.1:8000/modules/status" -TimeoutSec 5
            if (-not ($m.loaded -contains "auth")) { throw "auth not loaded in frozen exe: $($m.loaded -join ',')" }
            Write-Host "frozen modules loaded: $($m.loaded -join ', ')"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: tmf-sidecar
          path: backend/dist/tmf-sidecar.exe

  # ---- Broker: validate the station broker config boots ----
  broker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mosquitto
        run: choco install mosquitto --no-progress -y
      - name: Smoke-test config
        shell: pwsh
        run: |
          $exe = "C:\Program Files\mosquitto\mosquitto.exe"
          $p = Start-Process $exe -ArgumentList "-c","deploy/mosquitto.conf","-v" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw "broker exited early (bad config)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "broker config OK"

  # ---- Tauri installer ----
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        shell: pwsh
        run: Write-Host "::warning::Tauri shell scaffold pending — wired in a later phase."
      # Real build: setup node + rust, `tauri build`, upload installer.
