# APP-REPO release workflow (UPDATES.md §10.3). Copy to `.github/workflows/release.yml`
# in a forked application repo. The FRAMEWORK repo keeps only ci.yml — it never builds,
# signs, or publishes (a framework release is a git tag; RELEASE_HOWTO.md).
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# COST NOTE — both binaries are PyInstaller-frozen now (ADR 0003 in the framework repo),
#   not Nuitka-compiled: the backend build measures ~1.5 min, run_station.exe ~1.5 min. Neither
#   needs a warm compiler cache (no C-compile step at all), so the per-release cost here is
#   mostly the WebView2 fetch and Inno Setup compile.
#
#   `deploy/cut-release.ps1` (rendered from deploy/cut-release.ps1.template by new-test-app)
#   runs the SAME steps on a developer's machine and publishes the same Release + 4 assets, with
#   no CI minutes spent at all. A fork that adopts it MUST retarget the trigger below from
#   `on: push: tags` to `on: workflow_dispatch:` — otherwise the local script's tag push ALSO
#   fires this workflow and you pay for both. That retarget is an app-owned edit to this file;
#   keep whichever trigger matches how the fork actually cuts releases.
# ─────────────────────────────────────────────────────────────────────────────────────────
#
# Tag with the APP-track prefix `app-v<version>` (e.g. app-v1.2.0) and push ONLY that tag:
#     git tag app-v1.2.0 && git push origin app-v1.2.0
# NOT `git push --tags` — a fork inherits every framework `v*` tag (v1.0.0 … v1.12.0), and
# `--tags` would push them all, firing this workflow once per inherited tag. The `app-v`
# prefix also sidesteps the collision where the app's own v1.0.0/v1.1.0 line is already
# taken by framework baseline tags. The prefix is a TAG convention only: asset names stay
# plain `<slug>-<ver>.zip` / `.ksupdate`, and the in-app updater reads the version from the
# .ksupdate manifest (never the tag), so the prefix is invisible downstream.
#
# On an `app-v*` tag: guard tag==version → test → vendor Mosquitto → build (PyInstaller-frozen
# backend run.exe + PyInstaller-frozen run_station.exe onefile, + artifact zip + hash) → sign the
# .ksupdate → build the OFFLINE setup.exe (Inno Setup + bundled WebView2) → publish a GitHub
# Release whose body is that version's CHANGELOG section, carrying up to FOUR assets:
#   * <slug>-<ver>.ksupdate   trust envelope (in-app updater verifies this)          — always
#   * <slug>-<ver>.zip        the artifact the station verifies + swaps (in-app updates) — always
#   * run_station.exe         frozen windowed launcher (no Python on the client)     — if it built
#   * <AppShort>-Setup-<ver>.exe  OFFLINE first-install (run.dist + run_station.exe + WebView2) — if it built
# build_release.py is FAIL-SOFT on run_station.exe: the Build step exits 3 (not a hard failure)
# when it can't build/verify the frozen launcher, and this workflow then skips the setup.exe
# steps and publishes ONLY the first two assets — the in-app update path never needed
# run_station.exe, only first-install did. See the Build step's warning and DEPLOY_STATION.md.
# The GitHub Release is the single source for BOTH first-install (setup.exe, when present) and updates.
#
# Signing secrets are OPTIONAL for internal/pre-Keystation use: with none set, sign_update.py
# DEV-signs an UNTRUSTED .ksupdate — a client installs it only where app.json
# updates.allow_unverified=true (DEPLOY_STATION.md). Set them for a trusted, verified release:
#   KS_INTERMEDIATE_SEED   hex 32-byte Ed25519 seed of the rotatable intermediate key (secret)
#   KS_INTERMEDIATE_CERT   the root-signed intermediate cert (JSON) (secret)
# Required repo variables:
#   KS_PRODUCT_SLUG        this app's Keystation app-track product slug
# The app version comes from app/<slug>/VERSION (independent semver, starts 1.0.0); the
# framework version it was built upon is recorded automatically (RELEASE.json.pinned_fw_version).

name: release
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write        # create the Release

jobs:
  release:
    runs-on: windows-latest   # run_station.exe is a Windows-only frozen binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Tag matches the APP version AND is strictly newer than the latest published
        shell: bash
        run: |
          v="$(cat "app/${{ vars.KS_PRODUCT_SLUG }}/VERSION" | tr -d '[:space:]')"
          test "app-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != app app-v$v"; exit 1; }
          # tag==VERSION passes trivially even for a version REGRESSION (a distinct tag string
          # always satisfies it, and git only rejects an EXACT duplicate). Also demand the new
          # version be strictly semver-greater than the highest already-published app-v* tag —
          # matters now that more than one developer may cut releases from possibly-stale checkouts.
          git fetch --tags origin --quiet || true
          latest="$(git tag -l 'app-v*' | sed 's/^app-v//' | sort -V | tail -1)"
          if [ -n "$latest" ] && [ "$latest" != "$v" ]; then
            newest="$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)"
            test "$newest" = "$v" || { echo "app-v$v is not newer than the latest published app-v$latest"; exit 1; }
          fi
          echo "app version $v > $( [ -n "$latest" ] && echo "app-v$latest" || echo '(first release)' ) (framework $(python -c 'import sys;sys.path.insert(0,"backend");import core;print(core.__version__)'))"

      - name: Install
        shell: bash
        run: |
          # `release` pulls pyinstaller + pywebview (bundled into the frozen run_station.exe) —
          # nothing extra to install for the windowed launcher build.
          python -m pip install -e "backend[dev,release]"
          (cd frontend && npm ci)

      - name: Test (fast — is the code correct?)
        shell: bash
        run: |
          (cd backend && python -m pytest -q)
          (cd frontend && npx vitest run && npm run build)

      - name: Vendor Mosquitto (into run.dist — the station's own broker)
        shell: pwsh
        run: ./deploy/fetch-mosquitto.ps1

      - name: Build (PyInstaller: backend + run_station.exe) + package artifact + hash
        id: build
        shell: bash
        run: |
          # app version comes from app/<slug>/VERSION; the framework version it was built
          # upon is recorded automatically as pinned_fw_version in RELEASE.json. --track app also
          # vendors Mosquitto into run.dist and builds the frozen run_station.exe (bundles pywebview).
          #
          # build_release.py is FAIL-SOFT on run_station.exe: exit 3 means run.dist + the .zip/
          # .ksupdate (the in-app update artifact) built fine, but the frozen windowed launcher did
          # not compile or failed its own runtime smoke test — only the offline setup.exe needs it,
          # so don't fail the whole release; skip setup.exe for this run instead. Any OTHER non-zero
          # exit is a real build failure (e.g. the backend itself) and still fails the job.
          set +e
          python backend/build_release.py --track app --product "${{ vars.KS_PRODUCT_SLUG }}"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::run_station.exe failed its build/runtime smoke test — publishing this release WITHOUT run_station.exe or the offline setup.exe (run.dist + the in-app update artifact are unaffected)."
            echo "run_station_ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            echo "run_station_ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the .ksupdate
        shell: bash
        env:
          KS_INTERMEDIATE_SEED: ${{ secrets.KS_INTERMEDIATE_SEED }}
          KS_INTERMEDIATE_CERT: ${{ secrets.KS_INTERMEDIATE_CERT }}
          KS_TRACK: app
          KS_PINNED_FW_VERSION: ${{ vars.KS_PINNED_FW_VERSION }}
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          python tools/ks_release_signer/sign_update.py \
            release-build/RELEASE.json \
            "release-build/${{ vars.KS_PRODUCT_SLUG }}-${v}.ksupdate"

      # --- OFFLINE first-install setup.exe (Inno Setup + bundled WebView2) ---
      # Skipped when the "Build" step's fail-soft path already warned that run_station.exe
      # couldn't be built/verified on this runner — build-installer.ps1 needs it and would just
      # throw with the same guidance (build it where the tested MSVC toolchain is, e.g. here).
      - name: Fetch the offline WebView2 standalone runtime
        if: steps.build.outputs.run_station_ok == 'true'
        shell: pwsh
        run: |
          # The Evergreen Standalone Installer (x64) — an OS component pywebview renders through,
          # a no-op when already present. Pin a mirrored URL + hash for reproducibility if needed.
          New-Item -ItemType Directory -Force deploy\vendor\webview2 | Out-Null
          $out = "deploy\vendor\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile $out
          Write-Host "webview2 runtime: $((Get-Item $out).Length) bytes"

      - name: Install Inno Setup
        if: steps.build.outputs.run_station_ok == 'true'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the offline installer (setup.exe)
        if: steps.build.outputs.run_station_ok == 'true'
        shell: pwsh
        run: ./deploy/build-installer.ps1 -Slug "${{ vars.KS_PRODUCT_SLUG }}"

      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          awk -v ver="$v" '
            $0 ~ "^## " {inblk = ($2 == "v"ver || $2 == ver)}
            inblk {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $v" > release-notes.md

      - name: Publish Release (.ksupdate + artifact zip [+ run_station.exe + setup.exe])
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          assets=(
            "release-build/${{ vars.KS_PRODUCT_SLUG }}-${v}.ksupdate"
            "release-build/${{ vars.KS_PRODUCT_SLUG }}-${v}.zip"
          )
          # run_station.exe / setup.exe only exist when the fail-soft build step succeeded
          # (steps.build.outputs.run_station_ok) — a skipped/failed windowed-launcher build still
          # publishes the two assets above (the in-app updater doesn't need either).
          if [ "${{ steps.build.outputs.run_station_ok }}" = "true" ]; then
            # AppShort matches build-installer.ps1: branding.name with non-alphanumerics stripped.
            short="$(python -c 'import json,re,sys; b=json.load(open("backend/config/app.json"))["branding"] if __import__("os").path.exists("backend/config/app.json") else json.load(open("backend/config/app.example.json"))["branding"]; print(re.sub(r"[^A-Za-z0-9]","", b.get("name","") ) or sys.argv[1])' "${{ vars.KS_PRODUCT_SLUG }}")"
            assets+=("release-build/run_station.exe" "deploy/Output/${short}-Setup-${v}.exe")
          else
            echo "::warning::publishing WITHOUT run_station.exe / setup.exe this release (see the Build step's warning) — first-install stays on deploy/install-station.ps1 until a rebuild fixes it."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md \
            "${assets[@]}"
